<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<title>Teleprompter</title>
<link rel="icon" type="image/png" href="rabbit-icon-clean.png">
<link rel="apple-touch-icon" href="rabbit-icon-clean.png">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; background: #000; color: #fff; font-family: -apple-system, "Segoe UI", Roboto, sans-serif; overflow: hidden; }

  /* ---------- Edit screen ---------- */
  #editor { height: 100%; display: flex; flex-direction: column; }
  #editor header { padding: 14px 16px 8px; font-size: 20px; font-weight: 700;
                   display: flex; align-items: center; gap: 10px; }
  #editor header img { width: 34px; height: 34px; border-radius: 8px; }
  #script { flex: 1; margin: 8px 16px; padding: 14px; background: #141414; color: #eee;
            border: 1px solid #333; border-radius: 12px; font-size: 16px; line-height: 1.5; resize: none; }
  .controls { padding: 8px 16px calc(16px + env(safe-area-inset-bottom)); }
  .row { display: flex; align-items: center; gap: 12px; margin: 10px 0; }
  .row label { width: 84px; font-size: 14px; color: #aaa; }
  .row input[type=range] { flex: 1; accent-color: #e53935; }
  .row .val { width: 44px; text-align: right; font-size: 14px; color: #ddd; }
  #startBtn { width: 100%; padding: 16px; margin-top: 6px; border: none; border-radius: 14px;
              background: #e53935; color: #fff; font-size: 18px; font-weight: 700; }
  .smallBtns { display: flex; gap: 10px; margin-top: 10px; }
  .smallBtns button { flex: 1; padding: 10px; border-radius: 10px; border: 1px solid #444;
                      background: #1a1a1a; color: #ddd; font-size: 14px; }
  .smallBtns button.on { border-color: #e53935; color: #fff; }

  /* ---------- Camera / prompter screen ---------- */
  #stage { position: fixed; inset: 0; display: none; background: #000; }
  #cam { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
  #dim { position: absolute; inset: 0; background: rgba(0,0,0,0.55); }
  #scrollWrap { position: absolute; inset: 0; overflow: hidden; }
  #prompt { position: absolute; left: 0; right: 0; top: 100%;
            padding: 0 7vw; text-align: center; color: #fff;
            text-shadow: 0 2px 6px rgba(0,0,0,0.9); white-space: pre-wrap; }
  /* mirrored */
  .mirrored #scrollWrap { transform: scaleX(-1); }

  /* countdown */
  #count { position: absolute; inset: 0; display: none; align-items: center; justify-content: center;
           font-size: 28vw; font-weight: 800; color: #fff; text-shadow: 0 4px 24px rgba(0,0,0,0.8); z-index: 5; }

  /* top bar while recording */
  #topbar { position: absolute; top: 0; left: 0; right: 0; padding: calc(10px + env(safe-area-inset-top)) 14px 10px;
            display: flex; align-items: center; gap: 10px; z-index: 6; }
  #recDot { width: 12px; height: 12px; border-radius: 50%; background: #e53935; animation: blink 1s infinite; }
  @keyframes blink { 50% { opacity: 0.25; } }
  #timer { font-size: 16px; font-variant-numeric: tabular-nums; }

  /* bottom controls */
  #bottombar { position: absolute; bottom: 0; left: 0; right: 0;
               padding: 12px 18px calc(18px + env(safe-area-inset-bottom)); z-index: 6;
               display: flex; align-items: center; justify-content: space-between; }
  #stopBtn { width: 72px; height: 72px; border-radius: 50%; border: 4px solid #fff;
             background: #e53935; position: relative; }
  #stopBtn::after { content: ""; position: absolute; inset: 18px; background: #fff; border-radius: 6px; }
  .sideBtn { width: 52px; height: 52px; border-radius: 50%; border: 1px solid #666;
             background: rgba(0,0,0,0.5); color: #fff; font-size: 20px; }
  .pauseBtn { position: absolute; top: 50%; transform: translateY(-50%);
              width: 72px; height: 72px; font-size: 30px; z-index: 6; }
  #pauseLeft { left: 14px; }
  #pauseRight { right: 14px; }
  #speedSlider, #sizeSlider { width: 34vw; max-width: 170px; accent-color: #e53935; }

  /* toast */
  #toast { position: absolute; left: 50%; bottom: 120px; transform: translateX(-50%);
           background: rgba(0,0,0,0.8); padding: 10px 18px; border-radius: 10px; font-size: 14px;
           z-index: 9; display: none; }
</style>
</head>
<body>

<div id="editor">
  <header><img src="rabbit-icon-clean.png" alt="">Teleprompter</header>
  <textarea id="script" placeholder="Paste your script here..."></textarea>
  <div class="controls">
    <div class="row">
      <label>Speed</label>
      <input type="range" id="speed" min="10" max="200" value="80">
      <span class="val" id="speedVal">70</span>
    </div>
    <div class="row">
      <label>Text size</label>
      <input type="range" id="size" min="18" max="72" value="30">
      <span class="val" id="sizeVal">36</span>
    </div>
    <div class="smallBtns">
      <button id="mirrorBtn">Mirror: Off</button>
      <button id="cameraBtn">Camera: User</button>
    </div>
    <button id="startBtn">● Record &amp; Read</button>
  </div>
</div>

<div id="stage">
  <video id="cam" autoplay playsinline muted></video>
  <div id="dim"></div>
  <div id="scrollWrap"><div id="prompt"></div></div>
  <div id="count"></div>
  <div id="topbar">
    <div id="recDot"></div><div id="timer">0:00</div>
  </div>
  <div id="bottombar">
    <button class="sideBtn" id="cancelBtn" title="Cancel">✕</button>
    <button id="stopBtn" title="Stop recording"></button>
  </div>
  <button class="sideBtn pauseBtn" id="pauseLeft" title="Pause scrolling">⏸</button>
  <button class="sideBtn pauseBtn" id="pauseRight" title="Pause scrolling">⏸</button>
  <div id="toast"></div>
</div>

<script>
// camera access requires a secure origin — bounce plain HTTP to HTTPS
if (location.protocol === 'http:') {
  location.replace('https://' + location.host + location.pathname + location.search);
}
(function () {
  var scriptEl   = document.getElementById('script');
  var speedEl    = document.getElementById('speed');
  var sizeEl     = document.getElementById('size');
  var speedVal   = document.getElementById('speedVal');
  var sizeVal    = document.getElementById('sizeVal');
  var stage      = document.getElementById('stage');
  var cam        = document.getElementById('cam');
  var promptEl   = document.getElementById('prompt');
  var countEl    = document.getElementById('count');
  var timerEl    = document.getElementById('timer');
  var pauseBtns  = [document.getElementById('pauseLeft'), document.getElementById('pauseRight')];
  var mirrorBtn  = document.getElementById('mirrorBtn');
  var cameraBtn  = document.getElementById('cameraBtn');
  var toastEl    = document.getElementById('toast');
  var wakeLock   = null;
  var facing     = 'user';

  // --- persist script between sessions
  var DEFAULT_SCRIPT = 'Quick Guidelines...\n\nLimit your video to 45 seconds. Start with "Hey, Watermelon..." — not rushed, with a slight pause after you say it.\n\nEnsure you have plenty of light and don\'t use an artificial background.';
  try {
    // settings version: bump to force old saved values back to new defaults
    if (localStorage.getItem('tp_v') !== '3') {
      localStorage.removeItem('tp_script'); localStorage.removeItem('tp_speed'); localStorage.removeItem('tp_size');
      localStorage.setItem('tp_v', '3');
    }
    scriptEl.value = localStorage.getItem('tp_script') || DEFAULT_SCRIPT;
    speedEl.value  = localStorage.getItem('tp_speed') || 80;
    sizeEl.value   = localStorage.getItem('tp_size') || 30;
    facing         = localStorage.getItem('tp_facing') || 'user';
    updateLabels(); updateMirrorBtn(); updateCameraBtn();
  } catch (e) {}

  // --- script links: ?s=<base64url script>&c=<client name> (from teleprompter-send.html)
  try {
    var qs = new URLSearchParams(location.search);
    if (qs.get('s')) {
      var b64 = qs.get('s').replace(/-/g, '+').replace(/_/g, '/');
      while (b64.length % 4) b64 += '=';
      var bin = atob(b64);
      var bytes = new Uint8Array(bin.length);
      for (var bi = 0; bi < bin.length; bi++) bytes[bi] = bin.charCodeAt(bi);
      var linked = new TextDecoder().decode(bytes);
      if (linked.trim()) {
        scriptEl.value = linked;
        try { localStorage.setItem('tp_script', linked); } catch (e) {}
      }
    }
    if (qs.get('c')) {
      var hdr = document.querySelector('#editor header');
      var name = qs.get('c');
      hdr.lastChild.textContent = 'Teleprompter — ' + name;
      document.title = 'Teleprompter — ' + name;
    }
  } catch (e) {}
  scriptEl.addEventListener('input', function () { try { localStorage.setItem('tp_script', scriptEl.value); } catch (e) {} });
  speedEl.addEventListener('input', function () { updateLabels(); try { localStorage.setItem('tp_speed', speedEl.value); } catch (e) {} });
  sizeEl.addEventListener('input', function () { updateLabels(); try { localStorage.setItem('tp_size', sizeEl.value); } catch (e) {} });

  function updateLabels() {
    speedVal.textContent = speedEl.value;
    sizeVal.textContent = sizeEl.value;
    promptEl.style.fontSize = sizeEl.value + 'px';
    promptEl.style.lineHeight = 1.6;
  }
  function updateMirrorBtn() { mirrorBtn.textContent = 'Mirror: ' + (stage.classList.contains('mirrored') ? 'On' : 'Off'); mirrorBtn.classList.toggle('on', stage.classList.contains('mirrored')); }
  function updateCameraBtn() { cameraBtn.textContent = 'Camera: ' + (facing === 'user' ? 'Front' : 'Back'); }

  mirrorBtn.addEventListener('click', function () { stage.classList.toggle('mirrored'); updateMirrorBtn(); });
  cameraBtn.addEventListener('click', function () { facing = facing === 'user' ? 'environment' : 'user'; updateCameraBtn(); try { localStorage.setItem('tp_facing', facing); } catch (e) {} });

  function toast(msg, ms) {
    toastEl.textContent = msg; toastEl.style.display = 'block';
    setTimeout(function () { toastEl.style.display = 'none'; }, ms || 2500);
  }

  // ================= Start: camera -> countdown -> record -> scroll =================
  var stream = null, recorder = null, chunks = [];
  var scrolling = false, paused = false, scrollPos = 0, lastTs = 0;
  var recStart = 0, timerInt = null;

  document.getElementById('startBtn').addEventListener('click', start);
  document.getElementById('stopBtn').addEventListener('click', stop);
  document.getElementById('cancelBtn').addEventListener('click', cancel);
  function setPauseIcons() {
    pauseBtns.forEach(function (b) { b.textContent = paused ? '▶' : '⏸'; });
  }
  pauseBtns.forEach(function (b) {
    b.addEventListener('click', function () {
      paused = !paused;
      setPauseIcons();
    });
  });

  async function start() {
    var text = scriptEl.value.trim();
    if (!text) { toast('Type or paste a script first'); return; }
    if (location.protocol !== 'https:' && location.hostname !== 'localhost') {
      toast('Camera needs a secure (https) connection — reloading over https...');
      location.replace('https://' + location.host + location.pathname + location.search);
      return;
    }
    if (!navigator.mediaDevices || !window.MediaRecorder) { toast('This browser cannot record video'); return; }
    try {
      stream = await navigator.mediaDevices.getUserMedia({
        // high-res landscape maps to the camera's full wide sensor mode on most phones
        video: { facingMode: facing, width: { ideal: 1920 }, height: { ideal: 1080 } },
        audio: true
      });
    } catch (err) {
      var why = err.name === 'NotAllowedError' ? 'permission denied — allow camera & mic in Settings'
              : err.name === 'NotFoundError' ? 'no camera found'
              : err.name;
      toast('Camera problem: ' + why, 5000); return;
    }
    cam.srcObject = stream;

    // wait for video metadata so we know real frame dimensions (bail out after 5s)
    if (cam.readyState < 1) {
      await new Promise(function (r) {
        var to = setTimeout(r, 5000);
        cam.onloadedmetadata = function () { clearTimeout(to); r(); };
      });
    }

    promptEl.textContent = text;
    updateLabels();
    scrollPos = 0;
    promptEl.style.transform = 'translateY(0px)';
    stage.style.display = 'block';
    countEl.style.display = 'flex';

    try { wakeLock = await navigator.wakeLock.request('screen'); } catch (e) {}

    // 3 - 2 - 1 countdown
    for (var n = 3; n >= 1; n--) {
      countEl.textContent = n;
      await sleep(1000);
    }
    countEl.style.display = 'none';

    // begin recording.
    // Mobile cameras deliver landscape sensor frames and MediaRecorder doesn't
    // always apply portrait rotation, so composite into a portrait canvas and
    // record the canvas stream instead of the raw camera stream.
    chunks = [];
    var recStream = buildPortraitStream();
    var mime = pickMime();
    recorder = new MediaRecorder(recStream, mime ? { mimeType: mime } : undefined);
    recorder.ondataavailable = function (e) { if (e.data.size) chunks.push(e.data); };
    recorder.onstop = saveVideo;
    recorder.start(1000);

    recStart = Date.now();
    timerInt = setInterval(function () {
      var s = Math.floor((Date.now() - recStart) / 1000);
      timerEl.textContent = Math.floor(s / 60) + ':' + ('0' + s % 60).slice(-2);
    }, 250);

    scrolling = true; paused = false; setPauseIcons();
    lastTs = 0;
    requestAnimationFrame(tick);
  }

  function pickMime() {
    var candidates = ['video/mp4;codecs=avc1', 'video/mp4', 'video/webm;codecs=vp9,opus', 'video/webm;codecs=vp8,opus', 'video/webm'];
    for (var i = 0; i < candidates.length; i++) {
      if (MediaRecorder.isTypeSupported(candidates[i])) return candidates[i];
    }
    return '';
  }

  function sleep(ms) { return new Promise(function (r) { setTimeout(r, ms); }); }

  // --- portrait recording canvas ---
  var recCanvas = document.createElement('canvas');
  var recCtx = recCanvas.getContext('2d');

  function buildPortraitStream() {
    var vw = cam.videoWidth || 1080, vh = cam.videoHeight || 1920;
    var w = Math.min(vw, vh), h = Math.max(vw, vh);
    var cap = 1280;
    if (h > cap) { w = Math.round(w * cap / h); h = cap; }
    // keep dimensions even (some encoders require it)
    w -= w % 2; h -= h % 2;
    recCanvas.width = w; recCanvas.height = h;
    drawFrame();
    var cs = recCanvas.captureStream(30);
    stream.getAudioTracks().forEach(function (t) { cs.addTrack(t); });
    return cs;
  }

  // draw the camera frame onto the portrait canvas, center-cropped to fill.
  // (frames arrive upright from the phone camera — no rotation needed)
  function drawFrame() {
    var vw = cam.videoWidth, vh = cam.videoHeight;
    if (!vw || !vh) return;
    var cw = recCanvas.width, ch = recCanvas.height;
    var s = Math.max(cw / vw, ch / vh);
    var dw = vw * s, dh = vh * s;
    recCtx.drawImage(cam, (cw - dw) / 2, (ch - dh) / 2, dw, dh);
  }

  // smooth, frame-rate-independent scrolling.
  // slider 10..200  ->  roughly 5..100 px per second at typical font sizes
  function tick(ts) {
    if (!scrolling) return;
    requestAnimationFrame(tick);
    if (recorder && recorder.state === 'recording') drawFrame();
    if (paused || !lastTs) { lastTs = ts; return; }
    var dt = (ts - lastTs) / 1000;
    lastTs = ts;
    scrollPos += Number(speedEl.value) * dt;
    promptEl.style.transform = 'translateY(' + (-scrollPos) + 'px)';
  }

  async function teardown() {
    scrolling = false; paused = false;
    clearInterval(timerInt);
    if (wakeLock) { try { wakeLock.release(); } catch (e) {} wakeLock = null; }
    if (stream) { stream.getTracks().forEach(function (t) { t.stop(); }); stream = null; }
    cam.srcObject = null;
    stage.style.display = 'none';
    countEl.style.display = 'none';
  }

  function stop() {
    if (recorder && recorder.state !== 'inactive') {
      // let the recorder flush its final data BEFORE we release the camera
      recorder.onstop = function () { saveVideo(); };
      recorder.stop();
    } else {
      teardown();
    }
  }

  function cancel() {
    if (recorder && recorder.state !== 'inactive') {
      recorder.onstop = function () { teardown(); toast('Cancelled'); };
      recorder.stop();
    } else {
      teardown(); toast('Cancelled');
    }
  }

  async function saveVideo() {
    var blob = new Blob(chunks, { type: chunks.length ? chunks[0].type : 'video/webm' });
    var ext = (blob.type.indexOf('mp4') !== -1) ? 'mp4' : 'webm';
    var name = 'teleprompter-' + new Date().toISOString().replace(/[:.]/g, '-').slice(0, 19) + '.' + ext;
    var saved = false;
    // preferred path: share sheet -> "Save to Photos" / "Save to Gallery"
    try {
      var file = new File([blob], name, { type: blob.type });
      if (navigator.canShare && navigator.canShare({ files: [file] })) {
        await navigator.share({ files: [file], title: 'Teleprompter video' });
        saved = true;
      }
    } catch (e) {
      if (e.name === 'AbortError') { teardown(); return; } // user dismissed the sheet
      // anything else: fall through to download
    }
    if (!saved) {
      // fallback: download to Files/Downloads
      var url = URL.createObjectURL(blob);
      var a = document.createElement('a');
      a.href = url;
      a.download = name;
      document.body.appendChild(a); a.click(); a.remove();
      setTimeout(function () { URL.revokeObjectURL(url); }, 5000);
      toast('Saved to your downloads / Files');
    }
    teardown();
  }
})();
</script>
</body>
</html>
